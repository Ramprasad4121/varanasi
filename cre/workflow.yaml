# ==========================================================================
# CRE WORKFLOW SETTINGS FILE — varanasi confidential risk workflow
# ==========================================================================
# cre/ doubles as the CRE project root AND the workflow directory, so
# secrets-path points at ./secrets.yaml (not ../secrets.yaml as in the
# multi-workflow starter template layout).
staging-settings:
  user-workflow:
    workflow-name: "aegis-risk-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "./secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "aegis-risk-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "./secrets.yaml"
