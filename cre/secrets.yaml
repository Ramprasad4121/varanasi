# Author: Ramprasad
# ==========================================================================
# CRE SECRETS FILE — varanasi confidential risk workflow
# ==========================================================================
# Maps each workflow-facing secret ID (requested via `runtime.getSecret({id})`
# INSIDE the enclave) to the environment variable holding its value.
#
# In a Confidential Workflow these are released by the Vault DON directly into
# the attested enclave — never exposed in plaintext to node operators or to
# Workflow DON node memory. The three strategy secrets below are the sensitive
# inputs the prize brief requires to be processed inside the enclave:
#   RISK_THRESHOLD_BPS — private ACT/SKIP cutoff (bps, 0..10000)
#   STRATEGY_WEIGHTS   — private per-factor multipliers, JSON object
#   OPERATOR_ALLOWLIST — private roster of approved agent wallets, JSON array
#   AEGIS_API_KEY      — credential for POSTing verdicts to the agent API
#
# Local simulation: copy .env.example to .env and fill values in. Deployed
# workflows: values come from the Vault DON (see README).
secretsNames:
    RISK_THRESHOLD_BPS:
        - SECRET_RISK_THRESHOLD_BPS
    STRATEGY_WEIGHTS:
        - SECRET_STRATEGY_WEIGHTS
    OPERATOR_ALLOWLIST:
        - SECRET_OPERATOR_ALLOWLIST
    AEGIS_API_KEY:
        - SECRET_AEGIS_API_KEY
