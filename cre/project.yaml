# ==========================================================================
# CRE PROJECT SETTINGS FILE — varanasi
# ==========================================================================
# This workflow posts its verdict to the varanasi agent API and emits a signed
# DON report for RiskGuard (Sepolia). The Sepolia RPC below is here so Step 4
# can grow into a full on-chain `writeReport` without extra setup — see the
# Keeper Bot / Event Reactor templates for the write path.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
