# Author: Ramprasad — local prod stack for varanasi (service :4021 + frontend :3000).
services:
  signal:
    build: ./service
    ports: ["4021:4021"]
    env_file: ./service/.env
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: ./frontend/.env.local
    depends_on: [signal]
    restart: unless-stopped
