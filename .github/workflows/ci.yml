# Author: Ramprasad — varanasi CI. Every job runs from a clean checkout with
# zero secrets (verified locally: all suites pass with no .env files present).
# Forge fork tests self-skip without SEPOLIA_RPC_URL; agent tests use mocked
# fetch; frontend degrades to setup notices without NEXT_PUBLIC_* keys.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          # Forge deps (forge-std, v4-core, v4-periphery) are git submodules —
          # without this, contracts/lib/* is empty and forge build fails.
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      - run: forge test

  agent:
    name: agent (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  service:
    name: service (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: frontend (typecheck + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No NEXT_PUBLIC_* keys in CI: pages degrade to setup notices by design,
      # so the production build must succeed without them.
      - run: npm run build

  secrets:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action v3 requires the token to scope the scan on PRs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
