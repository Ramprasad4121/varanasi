# Author: Ramprasad — varanasi CI. Every job runs from a clean checkout with
# zero secrets (verified locally: all suites pass with no .env files present).
# Forge fork tests self-skip without SEPOLIA_RPC_URL; agent tests use mocked
# fetch; frontend degrades to setup notices without NEXT_PUBLIC_* keys.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          # forge-std is the ONLY forge dependency (contracts are zero-dep by
          # design, src/lib/* holds the protocol primitives) — recursive fetch
          # still required so contracts/lib/forge-std lands.
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      # --- TEMP DIAGNOSTIC v2: publish failures as annotations (revert me) ---
      - name: forge test (diagnose via annotations)
        continue-on-error: true
        run: |
          forge test -vv 2>&1 | tee /tmp/ft.log || true
          grep -E "^\s*\[FAIL" /tmp/ft.log | head -12 | while IFS= read -r l; do
            echo "::error::FAIL ${l}"
          done
          grep -nE "assertion|panic|Fail:" /tmp/ft.log | head -10 | while IFS= read -r l; do
            echo "::error::CTX ${l:0:180}"
          done
          exit 0
      - name: full forge test
        run: forge test

  agent:
    name: agent (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  service:
    name: service (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # In-memory adversarial harness over the built dist/ (no network, no keys).
      - run: node --test test/adversarial_service.test.mjs

  frontend:
    name: frontend (typecheck + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # No NEXT_PUBLIC_* keys in CI: pages degrade to setup notices by design,
      # so the production build must succeed without them.
      - name: npm run build (TEMP diagnose via annotations)
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/fb.log
          st=${PIPESTATUS[0]}
          if [ "$st" != "0" ]; then
            grep -nE "error|Error|EACCES|ENOENT|exited|Cannot" /tmp/fb.log | tail -8 | sed 's/^/::error::/'
          fi
          exit $st

  secrets:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action v3 requires the token to scope the scan on PRs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
